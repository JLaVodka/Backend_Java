spring.application.name=microservicio-java

# Render define PORT en ejecucion. En local se usa 8080.
server.port=${PORT:8080}
server.address=0.0.0.0

# En Render, configura SPRING_DATASOURCE_URL con formato JDBC:
# jdbc:postgresql://HOST_INTERNO:5432/NOMBRE_BD
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tareas}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Usa la tabla existente; no altera el esquema automaticamente.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
